<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>App Refiner（ブラッシュアップ司令塔）</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans"><header class="bg-gradient-to-r from-indigo-600 to-blue-600 p-4 text-white shadow sticky top-0 z-20"><div class="max-w-md mx-auto flex justify-between items-center"><h1 class="font-bold text-base">App Refiner（ブラッシュアップ司令塔）</h1><span class="text-[10px] bg-black/30 px-2 py-0.5 rounded-full font-mono">Live</span></div></header><main class="flex-1 p-4 max-w-md w-full mx-auto space-y-4"><div id="toast" class="p-3 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 rounded-xl text-xs font-semibold" style="display:none;">送信完了: データが保存されました！</div><form onsubmit="event.preventDefault(); document.getElementById('toast').style.display='block'; this.reset(); setTimeout(()=>document.getElementById('toast').style.display='none',3000);" class="space-y-3.5 bg-slate-900/90 border border-slate-800 p-4 rounded-2xl shadow-xl"><div class="space-y-1"><label class="text-[11px] font-semibold text-slate-300">対象アプリ</label><input type="text" name="target_app" placeholder="アプリ名またはリポジトリ名" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-xs"></div><div class="space-y-1"><label class="text-[11px] font-semibold text-slate-300">改修の種類</label><select name="refine_type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-xs"><option value="UI改善">UI改善</option><option value="機能追加">機能追加</option><option value="不具合修正">不具合修正</option><option value="リファクタ">リファクタ</option></select></div><div class="space-y-1"><label class="text-[11px] font-semibold text-slate-300">優先度</label><select name="priority" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-xs"><option value="高">高</option><option value="中">中</option><option value="低">低</option></select></div><div class="space-y-1"><label class="text-[11px] font-semibold text-slate-300">改修要望本文</label><textarea name="requirements" rows="3" placeholder="具体的な改修内容を入力してください" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-xs"></textarea></div><button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow text-xs mt-3">データを記録・送信する</button></form></main></body></html>
